name: test
channels:
  - conda-forge
platforms:
  - linux-64
dependencies:
  # runtime (mirrors requirements.txt)
  - python=3.13
  - anacal=0.8.3=py313*
  - stackvana>=0.2026.13=py313*
  - click
  - healpy
  - astropy
  - fitsio
  - lenstronomy
  - matplotlib
  - pyccl
  - namaster
  - scikit-learn
  - pywavelets
  - xgboost=*=cpu*
  # CPU builds of the GPU packages rubin-env (stackvana) pulls in; no CUDA
  - pytorch=*=cpu*
  - torchvision=*=cpu*
  - jaxlib=*=cpu*
  # test (mirrors requirements_test.txt)
  - nbval
  - flake8-pyproject
  - pytest
  - pytest-cov
  - pytest-xdist
  - pytest-timeout
  - pip
  # FlexCode is PyPI-only and is installed with `pip install --no-deps
  # FlexCode==0.2.3` in CI (see .github/workflows/tests.yml), not here: its
  # PyPI xgboost requirement drags in CUDA wheels conda-lock cannot place.
