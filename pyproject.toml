[project]
name = "xlens"
license = {file = "LICENSE"}
readme = "README.md"
authors = [
    { name = "Xiangchong Li", email = "mr.superonion@hotmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dynamic = ["version"]
# The LSST science pipelines (every ``lsst.*`` import) are ALSO required at
# runtime but are not pip-installable; they must come from conda-forge
# (stackvana / lsst-distrib) or a loaded LSST stack environment.
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "galsim",
    "fitsio",
    "anacal",
    "pyarrow",
    "matplotlib",
]

[project.optional-dependencies]
flexcode = ["flexcode"]
# pyccl is imported lazily by the lognormal shear-field simulator only.
lognormal = ["pyccl"]
notebooks = ["ipykernel"]

[project.urls]
"Source Code" = "https://github.com/mr-superonion/xlens"

[build-system]
requires = [
    "setuptools>=62",
    "setuptools_scm>=6.2",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "dirty-tag"
write_to = "xlens/__version__.py"

[tool.pytest.ini_options]
testpaths = [
    "tests/",
    "examples/shear/",
    "examples/cluster/",
]
addopts = "--nbval --nbval-lax --nbval-current-env -vv -s"

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 110
known_third_party = ["lsst"]

[tool.flake8]
# LSST DM Python Style Guide: https://developer.lsst.io/python/style.html
# E203, N801 are project-local exceptions:
#   E203: conflicts with black's slice formatting.
#   N801: keeps pre-existing lowercase class names (matchPipe, zEstimator, ...).
ignore = [
    "E133", "E203", "E226", "E228",
    "N801", "N802", "N803", "N806", "N812", "N813", "N815", "N816",
    "W503",
]
exclude = [".git", "__pycache__", "docs", "build", "dist"]
max-line-length = 110
max-doc-length = 79

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "N", "W"]
extend-select = ["RUF100"]
ignore = ["N802", "N803", "N806", "N812", "N813", "N815", "N816", "N999"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 79

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.coverage.run]
source = ["xlens"]
omit = ["xlens/__version__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]
