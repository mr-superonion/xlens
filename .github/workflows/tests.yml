name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Free disk space (ubuntu-latest)
        if: runner.os == 'Linux'
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo apt-get clean

      - name: Install system dependencies
        run: |
          sudo apt-get install -y build-essential

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up conda (Python ${{ matrix.python-version }})
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict
          auto-update-conda: true
          mamba-version: "*"
          activate-environment: test

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          # Use mamba (installed by setup-miniconda) to reduce solve time / churn
          conda config --set always_yes yes

          mamba install --file requirements.txt -c conda-forge
          conda clean -a -y
          mamba install --file requirements_test.txt -c conda-forge
          conda clean -a -y

          python -m pip install --upgrade pip setuptools FlexCode[all]
          pip install .

      - name: Test with pytest
        shell: bash -l {0}
        run: |
          wget https://github.com/mr-superonion/xlens/releases/download/v0.3.0/catsim-v4.tar.gz
          tar xvfz catsim-v4.tar.gz
          export CATSIM_DIR=$(realpath catsim-v4)
          pytest
