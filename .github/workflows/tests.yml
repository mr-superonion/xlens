name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Free disk space (ubuntu-24.04)
        if: runner.os == 'Linux'
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo apt-get clean

      - name: Install system dependencies
        run: |
          sudo apt-get install -y build-essential

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up conda (Python ${{ matrix.python-version }})
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true
          auto-update-conda: false
          # No environment activated yet; we create it from the lock file.
          activate-environment: ""

      - name: Cache conda pkgs
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: conda-pkgs-${{ runner.os }}-${{ hashFiles('conda-lock.yml') }}

      - name: Install environment from conda-lock.yml
        shell: bash -l {0}
        run: |
          conda config --set always_yes yes
          conda config --set channel_priority strict
          # conda-lock is published on conda-forge; install into base, then
          # use it to materialise the pinned `test` env without solving.
          mamba install -n base -c conda-forge conda-lock
          conda-lock install --name test conda-lock.yml
          conda clean -a -y

      - name: Install xlens (editable)
        shell: bash -l {0}
        run: |
          conda activate test
          pip install -e .

      - name: Test with pytest and coverage
        shell: bash -l {0}
        run: |
          conda activate test
          wget https://github.com/mr-superonion/xlens/releases/download/v0.3.0/catsim-v4.tar.gz
          tar xvfz catsim-v4.tar.gz
          export CATSIM_DIR=$(realpath catsim-v4)
          pytest tests/ --cov --cov-report=xml --cov-report=term
          pytest examples/shear
          pytest examples/cluster

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
